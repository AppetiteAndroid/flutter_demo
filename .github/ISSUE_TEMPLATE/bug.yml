name: Bug report
description: Report reproducible template behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private endpoints, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "What happened and what was expected?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal deterministic steps or repository fixture
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "flutter --version"
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification output
      description: Format/analyze/test/native result without sensitive logs
