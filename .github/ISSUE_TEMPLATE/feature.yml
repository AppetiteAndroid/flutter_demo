name: Feature request
description: Propose a reusable template capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "Which recurring template need is not covered?"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include removal path, tests, platforms and privacy impact
    validations:
      required: true
  - type: dropdown
    id: placement
    attributes:
      label: Placement
      options: [Base template, Optional recipe, Documentation only]
    validations:
      required: true
